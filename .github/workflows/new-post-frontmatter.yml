name: New Post Front Matter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-new-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - run: bun install --frozen-lockfile

      - name: Validate new blog and lore posts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/validate-new-post-frontmatter.ts "$BASE_SHA" "$HEAD_SHA"
