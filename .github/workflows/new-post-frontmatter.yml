name: New Post Front Matter

# Run on every PR so this remains a reliable required status check.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-new-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Detect newly added blog or lore posts
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Changed existing posts do not require metadata validation.
          new_paths="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | select(.status == "added" or .status == "renamed" or .status == "copied") | .filename')"
          if printf '%s\n' "$new_paths" | grep -Eq '^(blog/posts/[^/]+\.md|lore/posts/([^/]+/)*[^/]+\.md)$'; then
            echo 'has_new_posts=true' >> "$GITHUB_OUTPUT"
            echo 'New blog or lore post detected; validating.'
          else
            echo 'has_new_posts=false' >> "$GITHUB_OUTPUT"
            echo 'No new blog or lore posts; nothing to validate.'
          fi

      - name: No new posts to validate
        if: steps.detect.outputs.has_new_posts == 'false'
        run: echo 'PASS - no new blog or lore posts in this PR.'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.detect.outputs.has_new_posts == 'true'
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.detect.outputs.has_new_posts == 'true'
        with:
          bun-version: '1.4.2'

      - if: steps.detect.outputs.has_new_posts == 'true'
        run: bun install --frozen-lockfile

      - name: Validate new blog and lore posts
        if: steps.detect.outputs.has_new_posts == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/validate-new-post-frontmatter.ts "$BASE_SHA" "$HEAD_SHA"
